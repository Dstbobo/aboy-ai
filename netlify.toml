# Aboy AI — Netlify serves the static legal site in /web.
# This repo is an Expo/React Native app + FastAPI backend (no web build),
# so Netlify must NOT try to build — it just publishes the static /web folder.

[build]
  publish = "web"
  command = "echo 'Static legal site — no build step needed'"

# Clean URLs so /privacy and /terms work (not just the .html paths).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
