name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PROJECT_ID: 1b6fa081-85c8-4d73-b0c9-c9488fac29a6
  ENV_ID: 74fa354a-77ce-4c23-9a50-1a2cd41c40a9
  SERVICE_ID: 9d7c9935-1da8-4eda-8d72-90ad2d19d297
  RAILWAY_API: https://backboard.railway.app/graphql/v2

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Step 1: Mint a short-lived project token using the team/API token.
      # projectTokenCreate returns String! directly — no subfield selection.
      - name: Mint Railway project token
        id: mint
        run: |
          RESPONSE=$(curl -s -X POST "$RAILWAY_API" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { projectTokenCreate(input: { projectId: \\\"$PROJECT_ID\\\", environmentId: \\\"$ENV_ID\\\", name: \\\"gha-${{ github.run_id }}\\\" }) }\"}")
          echo "GraphQL response: $RESPONSE"
          # Response shape: {"data":{"projectTokenCreate":"<token>"}}
          PROJECT_TOKEN=$(echo "$RESPONSE" | grep -o '"projectTokenCreate":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Could not mint project token. Full response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$PROJECT_TOKEN"
          echo "project_token=$PROJECT_TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Project token minted"

      # Step 2: Install Railway CLI and upload backend files.
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend via railway up
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ steps.mint.outputs.project_token }}
          RAILWAY_PROJECT_ID: ${{ env.PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ env.ENV_ID }}
          RAILWAY_SERVICE_ID: ${{ env.SERVICE_ID }}
        run: |
          echo "Uploading backend to Railway service $SERVICE_ID..."
          railway up --service "$SERVICE_ID" --detach
          echo "✅ Upload complete — Railway is building"

      # Step 3: Verify the new code is live (health endpoint gets "auth":"httpx-v2").
      - name: Wait for Railway to finish building
        run: |
          echo "Waiting up to 5 minutes for Railway build to complete..."
          for i in $(seq 1 10); do
            sleep 30
            HEALTH=$(curl -s https://fantastic-possibility-production-f4fa.up.railway.app/health --max-time 10)
            echo "[$i/10] $HEALTH"
            if echo "$HEALTH" | grep -q "httpx-v2"; then
              echo "✅ New code is live!"
              exit 0
            fi
          done
          echo "⚠️  Build may still be in progress. Check Railway dashboard."
