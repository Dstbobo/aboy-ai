name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Step 1: try railway up with the token as-is (works if it's a project token)
      - name: Deploy (project token path)
        id: direct_deploy
        continue-on-error: true
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 1b6fa081-85c8-4d73-b0c9-c9488fac29a6
          RAILWAY_ENVIRONMENT_ID: 74fa354a-77ce-4c23-9a50-1a2cd41c40a9
          RAILWAY_SERVICE_ID: 9d7c9935-1da8-4eda-8d72-90ad2d19d297
        run: railway up --detach

      # Step 2: if that failed (team token), mint a project token via GraphQL then redeploy
      - name: Mint project token from team token
        if: steps.direct_deploy.outcome == 'failure'
        id: mint_token
        run: |
          PROJECT_TOKEN=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { projectTokenCreate(projectId: \"1b6fa081-85c8-4d73-b0c9-c9488fac29a6\", environmentId: \"74fa354a-77ce-4c23-9a50-1a2cd41c40a9\", name: \"gha-deploy\") { token } }"
            }' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "Failed to mint project token"
            exit 1
          fi
          echo "project_token=$PROJECT_TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy (team token → minted project token path)
        if: steps.direct_deploy.outcome == 'failure' && steps.mint_token.outcome == 'success'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ steps.mint_token.outputs.project_token }}
          RAILWAY_PROJECT_ID: 1b6fa081-85c8-4d73-b0c9-c9488fac29a6
          RAILWAY_ENVIRONMENT_ID: 74fa354a-77ce-4c23-9a50-1a2cd41c40a9
          RAILWAY_SERVICE_ID: 9d7c9935-1da8-4eda-8d72-90ad2d19d297
        run: railway up --detach

      - name: Verify health
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://fantastic-possibility-production-f4fa.up.railway.app/health)
          echo "Health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Backend healthy" || echo "⚠️ Backend not yet ready (may still be deploying)"
